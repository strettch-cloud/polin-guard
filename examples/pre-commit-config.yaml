# For users of the language-agnostic "pre-commit" framework (pre-commit.com).
# Add this to your repo's .pre-commit-config.yaml, then run: pre-commit install
#
# This points at the standalone POSIX scanner (scan-injection.sh) so it works
# without Node. For the Node version, use the husky hook or a local hook that
# calls `polin-guard --staged`.

repos:
  - repo: local
    hooks:
      - id: polin-guard
        name: polin-guard (block hidden injected payloads)
        entry: ./scan-injection.sh --staged
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
