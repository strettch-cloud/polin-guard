# polin-guard CI scan — the server-side backstop.
#
# A pre-commit hook can be bypassed with `git commit --no-verify` or by a
# force-push from a compromised machine. This workflow re-scans every push and
# pull request on the server, where it cannot be skipped — so even amended or
# force-pushed history is checked before it can be merged.
#
# Save as: .github/workflows/polin-guard.yml

name: polin-guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan sees all tracked files

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pin a version (or a commit SHA) once published, e.g. polin-guard@0.3.0
      - name: Scan all tracked files for injected payloads
        run: npx --yes polin-guard@latest --ci

      - name: Audit dependencies for supply-chain risk
        run: npx --yes polin-guard@latest install-audit
